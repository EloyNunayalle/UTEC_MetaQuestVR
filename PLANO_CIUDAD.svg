<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="880" fill="#11151c"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8eef7" font-size="22" font-weight="bold">PLANO DE LA CIUDAD — UTEC MetaQuestVR (v1)</text>
  <text x="500" y="56" text-anchor="middle" fill="#8fa3bd" font-size="13">Inspiración: Boston (rowhouses, manzanas irregulares) + NYC (avenida Broadway curva) · Escala 320 × 260 m · grilla de 3 px/m</text>

  <!-- fondo del mapa -->
  <rect x="20" y="72" width="960" height="780" fill="#2a2f38"/>

  <!-- avenida norte (12 m) y = 224..236 -->
  <rect x="20" y="92" width="960" height="36" fill="#6f7378"/>
  <!-- calle sur (6 m) y = 55..61 -->
  <rect x="20" y="617" width="960" height="18" fill="#6f7378"/>
  <!-- calles verticales x = 55..61, 145..151, 245..251 -->
  <rect x="185" y="128" width="18" height="672" fill="#6f7378"/>
  <rect x="455" y="128" width="18" height="672" fill="#6f7378"/>
  <rect x="755" y="128" width="18" height="672" fill="#6f7378"/>

  <!-- avenida curva (Broadway) 12 m -->
  <path d="M 20,359 C 180,330 300,392 470,359 S 800,330 980,366" stroke="#7f8388" stroke-width="36" fill="none" stroke-linecap="round"/>
  <path d="M 20,359 C 180,330 300,392 470,359 S 800,330 980,366" stroke="#9aa0a6" stroke-width="2" fill="none" stroke-dasharray="10 8" opacity="0.6"/>
  <text x="500" y="352" text-anchor="middle" fill="#e8eef7" font-size="13" font-weight="bold">AVENIDA CURVA (Broadway) — 12 m</text>

  <!-- bloques SUR (y 0..50/55) -->
  <!-- A: ESTACION -->
  <rect x="20" y="635" width="165" height="165" rx="3" fill="#b23a2e" stroke="#e8eef7" stroke-width="2"/>
  <text x="102" y="712" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">ESTACIÓN</text>
  <text x="102" y="732" text-anchor="middle" fill="#ffd9d4" font-size="11">🚒 recinto actual 22.8×33.3 m</text>
  <text x="102" y="748" text-anchor="middle" fill="#ffd9d4" font-size="11">portón al norte → Calle Sur</text>
  <rect x="88" y="633" width="28" height="6" fill="#f7c948"/>

  <!-- B: rowhouses -->
  <rect x="203" y="650" width="252" height="150" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <text x="329" y="720" text-anchor="middle" fill="#ffe8da" font-size="15" font-weight="bold">B · ROWHOUSES</text>
  <text x="329" y="740" text-anchor="middle" fill="#e8c9b8" font-size="11">Boston · ladrillo</text>

  <!-- C: M2 -->
  <rect x="473" y="650" width="282" height="150" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <rect x="473" y="650" width="282" height="150" rx="3" fill="#e6852e" opacity="0.22"/>
  <text x="614" y="712" text-anchor="middle" fill="#ffd9a8" font-size="17" font-weight="bold">M2 · INCENDIO ELÉCTRICO</text>
  <text x="614" y="734" text-anchor="middle" fill="#ffe8c8" font-size="12">~173 m · ~30 s en camión</text>

  <!-- D -->
  <rect x="20" y="395" width="165" height="222" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <text x="102" y="500" text-anchor="middle" fill="#ffe8da" font-size="15" font-weight="bold">D · TIENDAS</text>
  <text x="102" y="520" text-anchor="middle" fill="#e8c9b8" font-size="11">plantas bajas</text>

  <!-- E: M1 -->
  <rect x="203" y="395" width="252" height="222" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <rect x="203" y="395" width="252" height="222" rx="3" fill="#e6852e" opacity="0.22"/>
  <text x="329" y="495" text-anchor="middle" fill="#ffd9a8" font-size="17" font-weight="bold">M1 · INCENDIO</text>
  <text x="329" y="516" text-anchor="middle" fill="#ffd9a8" font-size="17" font-weight="bold">CONVENCIONAL</text>
  <text x="329" y="540" text-anchor="middle" fill="#ffe8c8" font-size="12">~86 m · ~15 s en camión</text>

  <!-- F: PLAZA -->
  <rect x="473" y="395" width="282" height="222" rx="3" fill="#4f6f45" stroke="#33502c" stroke-width="2"/>
  <text x="614" y="500" text-anchor="middle" fill="#d9f0c9" font-size="16" font-weight="bold">F · PLAZA</text>
  <text x="614" y="522" text-anchor="middle" fill="#bcd9ab" font-size="11">planters · bancas</text>
  <circle cx="560" cy="560" r="9" fill="#7fa36a"/>
  <circle cx="614" cy="575" r="9" fill="#7fa36a"/>
  <circle cx="668" cy="560" r="9" fill="#7fa36a"/>

  <!-- G -->
  <rect x="773" y="395" width="207" height="222" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <text x="876" y="500" text-anchor="middle" fill="#ffe8da" font-size="15" font-weight="bold">G · RELLENO</text>

  <!-- bloques NORTE (y 153..224) -->
  <rect x="20" y="128" width="165" height="213" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <text x="102" y="230" text-anchor="middle" fill="#ffe8da" font-size="14" font-weight="bold">H · ROWHOUSES</text>

  <rect x="203" y="128" width="252" height="213" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <text x="329" y="230" text-anchor="middle" fill="#ffe8da" font-size="14" font-weight="bold">I · ROWHOUSES</text>

  <rect x="473" y="128" width="282" height="213" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <text x="614" y="230" text-anchor="middle" fill="#ffe8da" font-size="14" font-weight="bold">J · EDIFICIOS PRE-ARMADOS</text>

  <rect x="773" y="128" width="207" height="213" rx="3" fill="#8a5a44" stroke="#5a3a2c" stroke-width="2"/>
  <rect x="773" y="128" width="207" height="213" rx="3" fill="#e6852e" opacity="0.22"/>
  <text x="876" y="222" text-anchor="middle" fill="#ffd9a8" font-size="16" font-weight="bold">M3 · RESCATE</text>
  <text x="876" y="244" text-anchor="middle" fill="#ffe8c8" font-size="12">~290 m · ~50 s</text>

  <!-- fondo norte -->
  <rect x="20" y="72" width="960" height="20" fill="#3a4048"/>
  <text x="500" y="86" text-anchor="middle" fill="#8fa3bd" font-size="11">fondo urbano (edificios bajos)</text>

  <!-- leyenda -->
  <g font-size="12" fill="#cfd9e6">
    <rect x="20" y="860" width="960" height="0" fill="none"/>
    <rect x="24" y="858" width="14" height="14" fill="#b23a2e"/><text x="44" y="869">Estación</text>
    <rect x="124" y="858" width="14" height="14" fill="#e6852e" opacity="0.8"/><text x="144" y="869">Casa de misión</text>
    <rect x="264" y="858" width="14" height="14" fill="#8a5a44"/><text x="284" y="869">Edificios (kit)</text>
    <rect x="384" y="858" width="14" height="14" fill="#4f6f45"/><text x="404" y="869">Plaza</text>
    <rect x="464" y="858" width="14" height="14" fill="#7f8388"/><text x="484" y="869">Calles</text>
    <rect x="544" y="858" width="14" height="14" fill="#f7c948"/><text x="564" y="869">Portón</text>
    <text x="640" y="869">■ 50 m = 150 px</text>
    <line x1="780" y1="865" x2="930" y2="865" stroke="#cfd9e6" stroke-width="2"/>
    <line x1="780" y1="860" x2="780" y2="870" stroke="#cfd9e6" stroke-width="2"/>
    <line x1="930" y1="860" x2="930" y2="870" stroke="#cfd9e6" stroke-width="2"/>
  </g>

  <!-- norte -->
  <g transform="translate(950,40)">
    <path d="M0,0 L-10,18 L0,13 L10,18 Z" fill="#e8eef7"/>
    <text x="0" y="-6" text-anchor="middle" fill="#e8eef7" font-size="12" font-weight="bold">N</text>
  </g>
</svg>
